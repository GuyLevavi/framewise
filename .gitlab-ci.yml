# Checks on every merge request; later weeks add evaluate, build and deploy.
# Project variables: CI_IMAGE, POSTGRES_IMAGE, BUILDAH_IMAGE, BASE_IMAGE (images in Quay),
# QUAY_IMAGE (where Framewise images go), QUAY_ROBOT_USER and QUAY_ROBOT_TOKEN (masked).
default:
  image: ${CI_IMAGE}

variables:
  UV_CACHE_DIR: .uv-cache
  POSTGRES_PASSWORD: postgres            # throwaway database that lives only for the job
  FRAMEWISE_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/postgres

cache:
  key:
    files: [uv.lock]
  paths: [.uv-cache]

stages: [lint, typecheck, test, evaluate, build, deploy]

before_script:
  - uv sync --frozen

lint:
  stage: lint
  script:
    - uv run ruff check .
    - uv run ruff format --check .

typecheck:
  stage: typecheck
  script:
    - uv run basedpyright

test:
  stage: test
  services:
    - name: ${POSTGRES_IMAGE}
      alias: postgres
  script:
    - DATABASE_URL=${FRAMEWISE_TEST_DATABASE_URL} uv run alembic upgrade head
    - DATABASE_URL=${FRAMEWISE_TEST_DATABASE_URL} uv run alembic check   # models and migrations agree
    - uv run pytest --cov=shared --cov=api --cov=worker --cov-report=term --junitxml=report.xml
  artifacts:
    when: always
    reports:
      junit: report.xml

evaluate:
  stage: evaluate
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  cache:
    - key: eval-clips            # downloaded clips are reused between runs
      paths: [eval/data]
  script:
    # The team helper library fills eval/data from DagsHub and Label Studio; see eval/test_gate.py.
    - uv run pytest -m eval -s

build:
  stage: build
  image: ${BUILDAH_IMAGE}        # Buildah needs no privileged container, unlike Docker-in-Docker
  needs: [evaluate]              # no image unless the model passed the gate
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script: []
  script:
    - buildah login -u "$QUAY_ROBOT_USER" -p "$QUAY_ROBOT_TOKEN" "${QUAY_IMAGE%%/*}"
    - buildah bud --build-arg BASE_IMAGE="$BASE_IMAGE" -t "$QUAY_IMAGE:$CI_COMMIT_SHORT_SHA" .
    - buildah push "$QUAY_IMAGE:$CI_COMMIT_SHORT_SHA"

deploy:
  stage: deploy
  needs: [build]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script: []
  script:
    # Argo CD watches deploy/chart with values-nonprod.yaml; changing the tag in Git is the release.
    - python3 scripts/bump_image_tag.py deploy/chart/values-nonprod.yaml "$CI_COMMIT_SHORT_SHA"
    - git config user.email "ci@framewise.invalid" && git config user.name "Framewise CI"
    - git commit -am "Deploy $CI_COMMIT_SHORT_SHA to nonprod [skip ci]"
    - git push "https://ci:${DEPLOY_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" HEAD:$CI_DEFAULT_BRANCH
