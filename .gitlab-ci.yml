# Checks on every merge request; later weeks add evaluate, build and deploy.
# CI_IMAGE and POSTGRES_IMAGE are project variables pointing at images in Quay.
default:
  image: ${CI_IMAGE}

variables:
  UV_CACHE_DIR: .uv-cache
  POSTGRES_PASSWORD: postgres            # throwaway database that lives only for the job
  FRAMEWISE_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/postgres

cache:
  key:
    files: [uv.lock]
  paths: [.uv-cache]

stages: [lint, typecheck, test, evaluate]

before_script:
  - uv sync --frozen

lint:
  stage: lint
  script:
    - uv run ruff check .
    - uv run ruff format --check .

typecheck:
  stage: typecheck
  script:
    - uv run basedpyright

test:
  stage: test
  services:
    - name: ${POSTGRES_IMAGE}
      alias: postgres
  script:
    - DATABASE_URL=${FRAMEWISE_TEST_DATABASE_URL} uv run alembic upgrade head
    - DATABASE_URL=${FRAMEWISE_TEST_DATABASE_URL} uv run alembic check   # models and migrations agree
    - uv run pytest --cov=shared --cov=api --cov=worker --cov-report=term --junitxml=report.xml
  artifacts:
    when: always
    reports:
      junit: report.xml

evaluate:
  stage: evaluate
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  cache:
    - key: eval-clips            # downloaded clips are reused between runs
      paths: [eval/data]
  script:
    # The team helper library fills eval/data from DagsHub and Label Studio; see eval/test_gate.py.
    - uv run pytest -m eval -s
