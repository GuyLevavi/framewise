apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
  labels: {{- include "framewise.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels: {app.kubernetes.io/component: api, app.kubernetes.io/instance: {{ .Release.Name }}}
  template:
    metadata:
      labels:
        {{- include "framewise.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      containers:
        - name: api
          image: {{ include "framewise.image" . }}
          ports: [{containerPort: 8000}]
          env: {{- include "framewise.appEnv" . | nindent 12 }}
          volumeMounts: {{- include "framewise.mounts" . | nindent 12 }}
          readinessProbe: {httpGet: {path: /health, port: 8000}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /health, port: 8000}, periodSeconds: 10, failureThreshold: 3}
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
      volumes: {{- include "framewise.volumes" . | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-api
  labels: {{- include "framewise.labels" . | nindent 4 }}
spec:
  selector: {app.kubernetes.io/component: api, app.kubernetes.io/instance: {{ .Release.Name }}}
  ports: [{port: 8000, targetPort: 8000}]
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ .Release.Name }}-api
  labels: {{- include "framewise.labels" . | nindent 4 }}
spec:
  {{- with .Values.route.host }}
  host: {{ . }}
  {{- end }}
  to: {kind: Service, name: {{ .Release.Name }}-api}
  port: {targetPort: 8000}
  tls: {termination: edge}
