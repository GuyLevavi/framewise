# Runs `alembic upgrade head` before Argo CD rolls out new pods.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-migrate-{{ .Values.image.tag | trunc 12 }}
  labels: {{- include "framewise.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: {{ include "framewise.image" . }}
          command: ["alembic", "upgrade", "head"]
          env: {{- include "framewise.appEnv" . | nindent 12 }}
