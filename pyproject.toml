[project]
name = "framewise"
version = "0.1.0"
description = "Video analytics training service: probe, detect, store, serve."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.162.0",
    "numpy>=1.26",
    "onnxruntime>=1.18",
    "opencv-python-headless>=4.9",
    "psycopg[binary]>=3.1",
    "pydantic>=2.6",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "tritonclient[http]>=2.40",
    "uvicorn>=0.54.0",
]

[project.scripts]
framewise = "shared.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "basedpyright>=1.18",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pre-commit>=3.7",
    "types-pyyaml>=6.0",
    "httpx>=0.28.1",
    "onnx>=1.23.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shared", "api", "worker"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH", "N"]

[tool.basedpyright]
include = ["shared", "api", "worker", "migrations", "scripts", "eval", "tests", "checks"]
exclude = ["deploy"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
reportMissingTypeStubs = false
reportUnknownParameterType = "error"
reportMissingParameterType = "error"
reportUnusedImport = "error"
reportUnusedVariable = "error"
reportPrivateUsage = "error"
reportUnnecessaryIsInstance = "error"

[tool.pytest.ini_options]
testpaths = ["tests", "checks", "eval"]
addopts = "-ra -m 'not eval'"
markers = ["eval: the evaluation gate on labeled clips (run with: pytest -m eval)"]
pythonpath = ["."]
filterwarnings = [
    # starlette asks for httpx2; the TestClient still works with httpx
    "ignore:Using `httpx` with `starlette.testclient`",
]
